    body {
      background: linear-gradient(135deg, #4e9f3d 0%, #25d366 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .linktree-container {
      max-width: 400px;
      margin: 48px auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      padding: 32px 24px;
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 16px;
      border: 4px solid #25d366;
    }
    .linktree-title {
      font-size: 1.7em;
      font-weight: 600;
      margin-bottom: 8px;
      color: #4e9f3d;
    }
    .linktree-desc {
      color: #555;
      margin-bottom: 24px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
      padding: 14px;
      font-size: 1.1em;
      font-weight: 500;
      border-radius: 12px;
      border: none;
      background: #f6f8fa;
      color: #333;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .link-btn:hover {
      background: #25d366;
      color: #fff;
      box-shadow: 0 4px 16px rgba(78,159,61,0.15);
    }
    .link-btn svg {
      width: 24px;
      height: 24px;
      vertical-align: middle;
    }
    .social-icons {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }
    .social-icons a {
      color: #25d366;
      background: #f6f8fa;
      border-radius: 50%;
      padding: 8px;
      transition: background 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .social-icons a:hover {
      background: #25d366;
      color: #fff;
    }
    .social-icons svg {
      width: 22px;
      height: 22px;
    }
  </style>
