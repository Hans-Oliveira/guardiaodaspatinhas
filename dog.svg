<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Fundo branco -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Contorno da cabeça -->
  <path d="M150,500 C100,400 80,250 150,150 
           C220,80 380,80 450,150 
           C520,250 500,400 450,500 
           C400,550 200,550 150,500 Z"
        fill="#c68642" stroke="#8b5e3c" stroke-width="6"/>
  
  <!-- Orelhas -->
  <path d="M120,180 C100,120 140,80 180,100" 
        fill="#c68642" stroke="#8b5e3c" stroke-width="4"/>
  <path d="M480,180 C500,120 460,80 420,100" 
        fill="#c68642" stroke="#8b5e3c" stroke-width="4"/>
  
  <!-- Olhos -->
  <circle cx="230" cy="250" r="20" fill="#fff"/>
  <circle cx="230" cy="250" r="10" fill="#5a3d2b"/>
  <circle cx="370" cy="250" r="20" fill="#fff"/>
  <circle cx="370" cy="250" r="10" fill="#5a3d2b"/>
  
  <!-- Nariz -->
  <ellipse cx="300" cy="330" rx="30" ry="20" fill="#5a3d2b"/>
  
  <!-- Boca -->
  <path d="M270,360 Q300,380 330,360" stroke="#5a3d2b" stroke-width="4" fill="none"/>
</svg>